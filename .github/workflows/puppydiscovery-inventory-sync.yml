name: PuppyDiscovery Inventory Sync
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sync public Noble Paw inventory
        run: node puppydiscovery-test/scripts/sync-inventory.mjs
      - name: Commit verified inventory changes
        run: |
          if git diff --quiet -- puppydiscovery-test/data; then
            echo "No inventory changes."
            exit 0
          fi
          git config user.name "PuppyDiscovery Sync"
          git config user.email "actions@github.com"
          git add puppydiscovery-test/data
          git commit -m "Sync PuppyDiscovery inventory"
          git push
