name: PuppyDiscovery Inventory Sync

on:
  workflow_dispatch:
  push:
    paths:
      - 'puppydiscovery-test/automation/**'
      - '.github/workflows/puppydiscovery-inventory.yml'
  schedule:
    - cron: '15 12 * * *'

permissions:
  contents: write

concurrency:
  group: puppydiscovery-inventory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium

      - name: Run safe inventory sync
        id: sync
        continue-on-error: true
        run: node puppydiscovery-test/automation/sync-inventory.mjs

      - name: Commit inventory state
        run: |
          if [[ -n "$(git status --porcelain -- puppydiscovery-test/data)" ]]; then
            git config user.name "PuppyDiscovery Inventory Bot"
            git config user.email "actions@users.noreply.github.com"
            git add puppydiscovery-test/data
            git commit -m "Update PuppyDiscovery inventory state"
            git push
          else
            echo "No inventory state changes."
          fi

      - name: Surface sync failure after preserving data
        if: steps.sync.outcome == 'failure'
        run: |
          echo "Inventory extraction did not pass confidence checks. Existing published inventory was preserved."
          exit 1
