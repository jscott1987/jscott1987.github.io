name: PuppyDiscovery Inventory Sync

on:
  push:
    paths:
      - 'puppydiscovery-test/automation/sync-inventory.mjs'
      - '.github/workflows/puppydiscovery-inventory.yml'
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: puppydiscovery-inventory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check inventory job
        run: node --check puppydiscovery-test/automation/sync-inventory.mjs

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium

      - name: Run safe inventory sync
        id: sync
        continue-on-error: true
        run: node puppydiscovery-test/automation/sync-inventory.mjs

      - name: Commit inventory state
        run: |
          if [[ -n "$(git status --porcelain -- puppydiscovery-test/data puppydiscovery-test/puppies puppydiscovery-test/sitemap.xml)" ]]; then
            git config user.name "PuppyDiscovery Inventory Bot"
            git config user.email "actions@users.noreply.github.com"
            git add puppydiscovery-test/data puppydiscovery-test/puppies puppydiscovery-test/sitemap.xml
            git commit -m "Update PuppyDiscovery inventory state"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "No inventory state changes."
          fi

      - name: Record safe sync warning
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::warning::Inventory extraction did not pass confidence checks. Existing published inventory was preserved."
          echo "The workflow is intentionally not failed because the safe fallback worked."
